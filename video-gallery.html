<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Video · Johnny Kwok</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-video">
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <img src="assets/Johnny.png" class="logo-image" alt="Johnny">
            </a>
            <button type="button" class="hamburger" aria-label="Toggle menu" aria-expanded="false">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#portfolio">Work</a></li>
                <li><a href="index.html#contact">Contact</a></li>
                <li class="nav-btn-container">
                    <a href="cv.html" class="nav-view-cv">View CV</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container page-header">
        <a href="index.html" class="back-link">← Back</a>
        <h1 class="animate-in">Video</h1>
    </div>

    <div class="container">
        <div class="photo-filters">
            <button type="button" class="btn-filter active" data-tab="my-work">My Work</button>
            <button type="button" class="btn-filter" data-tab="ig-reels">IG Reels</button>
            <button type="button" class="btn-filter" data-tab="youtube">YouTube Video</button>
        </div>

        <div id="my-work-content" class="video-tab-content active">
            <div class="video-gallery">
                <article class="video-entry animate-item">
                    <h2 class="video-entry-title">新東亞理髮店</h2>
                    <div class="video-wrap video-wrap--youtube">
                        <iframe src="https://www.youtube.com/embed/VxIicRGDKFY?si=EG9lCbgeGxE9A6ar" 
                                title="新東亞理髮店" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                </article>
                <article class="video-entry animate-item">
                    <h2 class="video-entry-title">《親暱》</h2>
                    <div class="video-wrap video-wrap--youtube">
                        <iframe src="https://www.youtube.com/embed/C5zvEAHLLqA?si=z-f6RzHjpwcMBrc9" 
                                title="《親暱》" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                    </div>                
                </article>
                <article class="video-entry animate-item">
                    <h2 class="video-entry-title">菲來何處去</h2>
                    <div class="video-wrap">
                        <video controls playsinline preload="metadata" src="assets/video/菲來何處去.mp4"
                            oncontextmenu="return false;" controlsList="nodownload"></video>
                    </div>
                </article>
            </div>
        </div>

        <div id="ig-reels-content" class="video-tab-content">
            <div class="ig-reels-grid">
                <div class="video-wrap video-wrap--reel">
                    <iframe src="https://www.instagram.com/reel/DQrMJ3TkvoA/embed/" allowfullscreen scrolling="no" allow="encrypted-media" title="IG Reel 1"></iframe>
                </div>
                <div class="video-wrap video-wrap--reel">
                    <iframe src="https://www.instagram.com/reel/DGinmsXz49-/embed/" allowfullscreen scrolling="no" allow="encrypted-media" title="IG Reel 2"></iframe>
                </div>
                <div class="video-wrap video-wrap--reel">
                    <iframe src="https://www.instagram.com/reel/DHKqKAzxE7E/embed/" allowfullscreen scrolling="no" allow="encrypted-media" title="IG Reel 3"></iframe>
                </div>
            </div>
        </div>

        <div id="youtube-content" class="video-tab-content">
            <div class="youtube-grid">
                <div class="video-wrap video-wrap--youtube">
                    <iframe data-yt-id="Gz-2-biqvmg" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                </div>
                <div class="video-wrap video-wrap--youtube">
                    <iframe data-yt-id="placeholder" title="YouTube 2" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                </div>
                <div class="video-wrap video-wrap--youtube">
                    <iframe data-yt-id="placeholder" title="YouTube 3" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>© 2026 Johnny Kwok</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
