<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphic Design · Johnny Kwok</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-graphic-design">
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <img src="assets/Johnny.png" class="logo-image" alt="Johnny">
            </a>
            <button type="button" class="hamburger" aria-label="Toggle menu" aria-expanded="false">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#portfolio">Work</a></li>
                <li><a href="index.html#contact">Contact</a></li>
                <li class="nav-btn-container">
                    <a href="cv.html" class="nav-view-cv">View CV</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container page-header">
        <a href="index.html" class="back-link">← Back</a>
        <h1 class="animate-in">Graphic Design</h1>
    </div>

    <div class="container">
        <div class="photo-filters">
            <button type="button" class="btn-filter active" data-category="all">All</button>
            <button type="button" class="btn-filter" data-category="my-works">My Works</button>
            <button type="button" class="btn-filter" data-category="commercial">Commercial</button>
            <button type="button" class="btn-filter" data-category="ai">AI</button>
        </div>
        <div class="masonry-gallery photo-gallery-grid">
            <div class="mosaic-item animate-item" data-category="my-works">
                <span class="media-protect">
                    <img src="assets/graphic/My Works/Mushroom.jpg" alt="My work 1" draggable="false">
                    <span class="media-protect__overlay" aria-hidden="true"></span>
                </span>
            </div>
            <div class="mosaic-item animate-item" data-category="my-works">
                <span class="media-protect">
                    <img src="assets/graphic/My Works/Zine.png" alt="My work 2" draggable="false">
                    <span class="media-protect__overlay" aria-hidden="true"></span>
                </span>
            </div>
            <div class="mosaic-item animate-item" data-category="commercial">
                <span class="media-protect">
                    <img src="assets/graphic-design/commercial/1.jpg" alt="Commercial 1" draggable="false">
                    <span class="media-protect__overlay" aria-hidden="true"></span>
                </span>
            </div>
            <div class="mosaic-item animate-item" data-category="commercial">
                <span class="media-protect">
                    <img src="assets/graphic-design/commercial/2.jpg" alt="Commercial 2" draggable="false">
                    <span class="media-protect__overlay" aria-hidden="true"></span>
                </span>
            </div>
            <div class="mosaic-item animate-item" data-category="commercial">
                <span class="media-protect">
                    <img src="assets/graphic-design/commercial/3.jpg" alt="Commercial 3" draggable="false">
                    <span class="media-protect__overlay" aria-hidden="true"></span>
                </span>
            </div>
            <div class="mosaic-item animate-item" data-category="ai">
                <span class="media-protect">
                    <img src="assets/graphic-design/ai/1.jpg" alt="AI 1" draggable="false">
                    <span class="media-protect__overlay" aria-hidden="true"></span>
                </span>
            </div>
            <div class="mosaic-item animate-item" data-category="ai">
                <span class="media-protect">
                    <img src="assets/graphic-design/ai/2.jpg" alt="AI 2" draggable="false">
                    <span class="media-protect__overlay" aria-hidden="true"></span>
                </span>
            </div>
            <div class="mosaic-item animate-item" data-category="ai">
                <span class="media-protect">
                    <img src="assets/graphic-design/ai/3.jpg" alt="AI 3" draggable="false">
                    <span class="media-protect__overlay" aria-hidden="true"></span>
                </span>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>© 2026 Johnny Kwok</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
